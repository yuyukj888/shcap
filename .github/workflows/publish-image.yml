name: publish-image

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '镜像标签（如 1.0.5）'
        required: true
        default: '1.0.5'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 取 SHCAP Shell 发布包
        run: |
          mkdir -p build
          curl -fsSL -o /tmp/NapCat.Shell.zip https://github.com/yuyukj888/shcap/releases/download/v1.0.5/NapCat.Shell.zip
          unzip -q /tmp/NapCat.Shell.zip -d build/napcat
          ls build/napcat | head

      - name: 版本号
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: |
            ghcr.io/yuyukj888/shcap:${{ steps.ver.outputs.tag }}
            ghcr.io/yuyukj888/shcap:latest
          labels: |
            org.opencontainers.image.source=https://github.com/yuyukj888/shcap
            org.opencontainers.image.version=${{ steps.ver.outputs.tag }}
