services:
  shcap:
    # 【过渡】官方镜像 ghcr.io/yuyukj888/shcap 正在发布中，暂时仍用上游运行时 + 下面挂载 SHCAP Shell
    # 发布完成后这里会换成：image: ghcr.io/yuyukj888/shcap:1.0.5
    image: docker.1ms.run/mlikiowa/napcat-docker:latest
    container_name: shcap
    restart: unless-stopped
    # 固定主机名：Docker 默认用容器 ID 当 hostname，重建后 QQ 会当成新设备，反复要求新设备验证
    hostname: "SHCAP的电脑"
    # 给 QQ 留出退出落盘时间；配合 entrypoint 的 exec，登录态才能写回卷，重启后自动快速登录
    stop_grace_period: 60s
    env_file: .env
    environment:
      - NAPCAT_QUICK_PASSWORD=${NAPCAT_QUICK_PASSWORD:-}
    ports:
      - "6099:6099"
      - "3001:3001"
    volumes:
      # 配置（OneBot / WebUI / 邮件告警）必须持久化，否则重建容器会丢
      - ./config:/app/napcat/config
      # QQ 登录态：重启后能否免验证快速登录全靠它
      - ./qq:/app/.config/QQ
      # 镜像里已内置 SHCAP Shell 与优雅退出补丁；只有想自行改壳/加插件时才需要挂载
      # - ./napcat:/app/napcat
      # - ./patches/entrypoint.sh:/app/entrypoint.sh:ro
